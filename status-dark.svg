<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" role="img" aria-label="DISCORD: Sem atividade agora">
  <style>
    .m { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; letter-spacing: .14em; }
    .t { font-family: "Space Grotesk", "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
    .eq rect { transform-origin: bottom; transform-box: fill-box; animation: eq .9s ease-in-out infinite alternate; }
    .eq rect:nth-child(2) { animation-duration: .7s; } .eq rect:nth-child(3) { animation-duration: 1.1s; } .eq rect:nth-child(4) { animation-duration: .8s; }
    @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
    .live { animation: blink 1.6s steps(2, jump-none) infinite; } @keyframes blink { 50% { opacity: .2; } }
  </style>
  <defs><clipPath id="c"><rect x="24" y="24" width="142" height="142" rx="12"/></clipPath></defs>
  <rect x=".5" y=".5" width="839" height="189" rx="20" fill="#0E1015" stroke="#1C2029"/>
  
  <g class="m" font-size="11" fill="#7A8394">
    <circle class="live" cx="45" cy="44" r="4.5" fill="#3D7BFF"/>
    <text x="58" y="48">AO VIVO · DISCORD</text>
    <text x="816" y="48" text-anchor="end"><tspan fill="#80848e">●</tspan> OFFLINE</text>
  </g>
  
  <text class="t" x="40" y="88" font-size="28" font-weight="700" fill="#ECEEF2">Sem atividade agora</text>
  <text class="t" x="40" y="118" font-size="17" fill="#7A8394"></text>
  
  <text class="m" x="40" y="168" font-size="10" fill="#7A8394">ATUALIZADO 31/10, 14:58 · BRT</text>
</svg>

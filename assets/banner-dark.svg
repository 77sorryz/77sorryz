<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="sorry. Keven, dev, design and motion">
  <defs>
    <!-- meio-tom: o texto é preenchido por uma grade de pontos -->
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="3.3" fill="#ECEEF2"/>
    </pattern>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1C2029"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="62%" r="45%">
      <stop offset="0" stop-color="#3D7BFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3D7BFF" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: .18em; }
      .big  { font-family: "Space Grotesk", "Inter", "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -.02em; }
      .rec  { animation: rec 1.6s steps(2, jump-none) infinite; }
      .pulse { transform-origin: 904px 262px; animation: pulse 2.4s ease-in-out infinite; }
      .scan { animation: scan 6s linear infinite; }
      .caret { animation: rec 1.1s steps(2, jump-none) infinite; }
      @keyframes rec { 50% { opacity: .15; } }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
      @keyframes scan { from { transform: translateX(-320px); } to { transform: translateX(1600px); } }
      @media (prefers-reduced-motion: reduce) { .rec, .pulse, .scan, .caret { animation: none; } }
    </style>
    <clipPath id="frame"><rect width="1280" height="400" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
  <rect width="1280" height="400" rx="22" fill="#07080B"/>
  <rect width="1280" height="400" rx="22" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="22" fill="url(#glow)"/>
  <!-- letterbox -->
  <rect x="0" y="0" width="1280" height="34" fill="#000" opacity=".55"/>
  <rect x="0" y="366" width="1280" height="34" fill="#000" opacity=".55"/>
  <!-- feixe do projetor passando -->
  <rect class="scan" x="0" y="34" width="180" height="332" fill="#3D7BFF" opacity=".05"/>
  <g class="mono" font-size="13" fill="#7A8394">
    <circle class="rec" cx="62" cy="68" r="5" fill="#3D7BFF"/>
    <text x="78" y="73">REEL 01 · 00:00:07:12</text>
    <text x="1218" y="73" text-anchor="end">DEV · DESIGN · MOTION</text>
  </g>
  <text class="big" x="52" y="286" font-size="205" textLength="820" lengthAdjust="spacingAndGlyphs" fill="url(#dots)">sorry</text>
  <circle class="pulse" cx="904" cy="262" r="25" fill="#3D7BFF"/>
  <g class="mono" font-size="15" fill="#ECEEF2">
    <text x="58" y="338">KEVEN · CÓDIGO, DESIGN E MOVIMENTO<tspan class="caret" fill="#3D7BFF"> ▍</tspan></text>
  </g>
  </g>
</svg>
